# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-dexypy"
dynamic = ["version"]
description = "Turn an HTML page into slide decks (PDF/SVG) through several engines at once."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Twardoch" }]
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
    "fire>=0.6",
    "loguru>=0.7",
    "rich>=13.7",
    "anyio>=4",
]

[project.optional-dependencies]
# Heavy / platform-specific engines kept optional so the core installs anywhere.
browser = ["playwright>=1.48"]
extract = ["trafilatura>=1.12"]
pdf = ["pikepdf>=9.4"]
vision = ["instructor>=1"]
all = [
    "playwright>=1.48",
    "trafilatura>=1.12",
    "pikepdf>=9.4",
]

[project.scripts]
vexy-dexypy = "vexy_dexypy.__main__:main"

[project.entry-points."vexy_dexypy.readers"]
static = "vexy_dexypy.readers.static:StaticReader"
dynamic = "vexy_dexypy.readers.dynamic:DynamicReader"

[project.entry-points."vexy_dexypy.importers"]
webflow = "vexy_dexypy.importers.webflow:WebflowImporter"
mkdocs-material = "vexy_dexypy.importers.mkdocs:MkdocsImporter"
docusaurus = "vexy_dexypy.importers.others:DocusaurusImporter"
bubble = "vexy_dexypy.importers.others:BubbleImporter"
framer = "vexy_dexypy.importers.others:FramerImporter"
generic = "vexy_dexypy.importers.generic:GenericImporter"

[project.entry-points."vexy_dexypy.exporters"]
playwright = "vexy_dexypy.exporters.playwright:PlaywrightExporter"
vivliostyle = "vexy_dexypy.exporters.vivliostyle:VivliostyleExporter"
reveal = "vexy_dexypy.exporters.reveal:RevealExporter"
prince = "vexy_dexypy.exporters.prince:PrinceExporter"
impress = "vexy_dexypy.exporters.impress:ImpressExporter"
marp = "vexy_dexypy.exporters.marp:MarpExporter"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Git-tag-based semver written to a gitignored module at build time.
version-file = "src/vexy_dexypy/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_dexypy"]
artifacts = ["src/vexy_dexypy/assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 88
